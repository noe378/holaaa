<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario de Opinión</title>
</head>
<body>
  <h1>Déjanos tu opinión</h1>

  <form action="guardar-opinion.php" method="post">
    <label for="id">ID:</label><br />
    <input type="number" id="id" name="id" required /><br />

    <label for="name">Nombre:</label><br />
    <input type="text" id="name" name="name" required /><br />

    <label for="address">Dirección:</label><br />
    <input type="text" id="address" name="address" required /><br />

    <label for="quote">Opinión:</label><br />
    <textarea id="quote" name="cuote" required></textarea><br />

    <input type="submit" value="Enviar Opinión" />
  </form>
</body>
</html>
