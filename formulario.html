<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Opiniones de Clientes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #ffe6f0;
    }
    h2 {
      color: #c71585;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    input[type="submit"] {
      background-color: #c71585;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Déjanos tu opinión</h2>
  <form action="guardar-opinion.php" method="POST">
    <label>Nombre:</label>
    <input type="text" name="nombre" required>

    <label>Correo electrónico:</label>
    <input type="email" name="correo" required>

    <label>Tu opinión:</label>
    <textarea name="opinion" rows="4" required></textarea>

    <br><br>
    <input type="submit" value="Enviar opinión">
  </form>
  <form action="guardar-opinion.php" method="POST">
  <input type="text" name="nombre" placeholder="Tu nombre" required>
  <textarea name="mensaje" placeholder="Tu opinión" required></textarea>
  <button type="submit">Enviar</button>
</form>


</body>
</html>
